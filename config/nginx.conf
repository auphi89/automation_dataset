# CBOM runtime-config fixture: protocol version pins, cipher suites and cert paths.
events {}
http {
    server {
        listen 443 ssl;
        server_name cbom-fixture.opswat.com;
        ssl_certificate     /etc/ssl/certs/ca-bundle.crt;
        ssl_certificate_key /etc/ssl/private/server.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DES-CBC3-SHA:RC4-SHA;
        ssl_prefer_server_ciphers on;
    }
}
