# CBOM runtime-config fixture: an OpenSSL system policy that re-enables legacy protocols.
openssl_conf = default_conf

[default_conf]
ssl_conf = ssl_sect

[ssl_sect]
system_default = system_default_sect

[system_default_sect]
MinProtocol = TLSv1
MaxProtocol = TLSv1.3
CipherString = DEFAULT:@SECLEVEL=0
